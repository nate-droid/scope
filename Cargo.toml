[profile.dev]
debug = false
incremental = true

# Keep line tables for Scope code, but omit dependency debug information.
# The test profile inherits this package override from dev.
[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = true

[workspace]
resolver = "3"
default-members = ["crates/scope-workbench"]
members = ["crates/scope-workbench", "crates/scope-ide", "crates/scope-language", "crates/scope-types", "crates/scope-meta", "crates/scope-execution", "crates/xtask", "crates/scope-script", "crates/scope-terminal"]


[workspace.dependencies]
cell-capability-fs = { git = "https://github.com/nate-droid/cell", tag = "v0.0.4" }
cell = { git = "https://github.com/nate-droid/cell", tag = "v0.0.4" }
cell-capability-log = { git = "https://github.com/nate-droid/cell", tag = "v0.0.4" }
cell-capability-openai = { git = "https://github.com/nate-droid/cell", tag = "v0.0.4" }
cell-capability-lmstudio = { git = "https://github.com/nate-droid/cell", tag = "v0.0.4" }
cell-guest = { git = "https://github.com/nate-droid/cell", tag = "v0.0.4" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
