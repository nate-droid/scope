[workspace]
resolver = "3"
default-members = ["crates/scope-workbench"]
members = ["crates/scope-workbench", "crates/scope-ide", "crates/scope-language", "crates/scope-types", "crates/scope-meta", "crates/scope-execution", "crates/xtask", "crates/scope-script", "crates/scope-terminal"]


[workspace.dependencies]
cell-capability-fs = { git = "https://github.com/nate-droid/cell", tag = "v0.0.2" }
cell = { git = "https://github.com/nate-droid/cell", tag = "v0.0.2" }
cell-capability-log = { git = "https://github.com/nate-droid/cell", tag = "v0.0.2" }
cell-capability-openai = { git = "https://github.com/nate-droid/cell", tag = "v0.0.2" }
cell-guest = { git = "https://github.com/nate-droid/cell", tag = "v0.0.2" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
