[package]
name = "scope-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A capability-oriented semantic development environment built on Cell"

[features]
default = []
tools = []
logging = ["dep:cell-capability-log"]
agent = ["tools", "dep:cell-capability-openai", "dep:serde"]
tui = ["dep:ratatui"]

[[example]]
name = "native_logging"
required-features = ["logging"]

[[example]]
name = "m2b_live"
required-features = ["agent"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
cell.workspace = true
cell-capability-fs.workspace = true
cell-capability-log = { workspace = true, optional = true }
cell-capability-openai = { workspace = true, optional = true }
cell-guest.workspace = true
scope-language = { path = "../scope-language" }
scope-meta = { path = "../scope-meta" }
scope-terminal = { path = "../scope-terminal" }
crossterm = "0.28"
ratatui = { version = "0.29", optional = true, features = ["unstable-rendered-line-info"] }

[dev-dependencies]
scope-types = { path = "../scope-types" }
