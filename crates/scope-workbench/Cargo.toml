[package]
name = "scope-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Default unprivileged Scope Script workbench"
default-run = "scope"

[[bin]]
name = "scope"
path = "src/main.rs"

[[bin]]
name = "scope-desktop"
path = "src/desktop_main.rs"
required-features = ["desktop"]

[features]
default = ["tui"]
tui = ["scope-ide/tui"]
agent = ["scope-ide/agent", "scope-script/agent"]
desktop = ["scope-ide/desktop", "dep:eframe"]

[dependencies]
scope-ide = { path = "../scope-ide" }
scope-script = { path = "../scope-script" }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
